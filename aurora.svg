<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="auroraSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060f"/>
      <stop offset="55%" stop-color="#0a0f26"/>
      <stop offset="100%" stop-color="#141a3d"/>
    </linearGradient>
    <linearGradient id="ribbon1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39ffa0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#39c8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7a3fff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a3fff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#39ffa0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#39c8ff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1024"/>
      <stop offset="100%" stop-color="#05060d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#auroraSky)"/>

  <!-- stars -->
  <g fill="#f4f1e8">
    <circle cx="60" cy="60" r="1.4" opacity="0.8"/>
    <circle cx="150" cy="110" r="1" opacity="0.6"/>
    <circle cx="230" cy="50" r="1.6" opacity="0.9"/>
    <circle cx="320" cy="90" r="1" opacity="0.5"/>
    <circle cx="410" cy="40" r="1.3" opacity="0.7"/>
    <circle cx="500" cy="80" r="1" opacity="0.6"/>
    <circle cx="600" cy="55" r="1.5" opacity="0.8"/>
    <circle cx="690" cy="100" r="1" opacity="0.5"/>
    <circle cx="740" cy="40" r="1.3" opacity="0.7"/>
    <circle cx="30" cy="150" r="1" opacity="0.5"/>
    <circle cx="380" cy="150" r="0.9" opacity="0.5"/>
    <circle cx="650" cy="160" r="1.1" opacity="0.6"/>
  </g>

  <!-- aurora ribbons -->
  <path d="M -50 220 Q 150 120 300 200 T 650 180 T 900 240 L 900 340 Q 650 260 500 320 T 150 300 T -50 360 Z" fill="url(#ribbon1)"/>
  <path d="M -50 300 Q 200 260 380 340 T 900 320 L 900 420 Q 600 380 420 420 T -50 440 Z" fill="url(#ribbon2)"/>
  <path d="M -50 180 Q 220 80 420 160 T 900 140 L 900 200 Q 600 140 400 200 T -50 240 Z" fill="url(#ribbon1)" opacity="0.5"/>

  <!-- mountains -->
  <polygon points="-20,600 120,380 220,470 320,340 420,480 520,360 640,470 760,400 850,600" fill="url(#mountainGrad)"/>
  <polygon points="-20,600 90,460 210,540 330,430 460,560 600,470 730,560 850,600" fill="#03040a"/>

  <!-- reflection glow -->
  <ellipse cx="400" cy="560" rx="380" ry="30" fill="#39c8ff" opacity="0.08"/>
</svg>
